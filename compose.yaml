services:
  postgres:
    image: postgres:17
    container_name: job-search-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lab

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: job-search-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      TZ: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab

  ollama:
    image: ollama/ollama:latest
    container_name: job-search-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lab

  chat-web:
    build: ./chat-web
    container_name: job-search-chat-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:?Set N8N_CHAT_WEBHOOK_URL in .env}
      N8N_CHAT_TIMEOUT: ${N8N_CHAT_TIMEOUT:-180}
    depends_on:
      - n8n
    networks:
      - lab

volumes:
  postgres_data:
  n8n_data:
  ollama_data:

networks:
  lab:
    name: job-search-lab
